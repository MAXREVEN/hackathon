/* Fetches ONLY the newest message of the ntfy topic (poll=1 + since=latest). Returns {title,text,time}, or null if there is none. */
async function ntfyLatest(){
const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),10000);let r;
try{r=await fetch(NTFY_URL+'/json?poll=1&since=latest',{cache:'no-store',signal:ctl.signal})}
catch(e){throw new Error(e&&e.name==='AbortError'?'ntfy took too long to answer. Please try again.':'Cannot reach ntfy. Check your internet connection and try again.')}
finally{clearTimeout(to)}
if(!r.ok)throw new Error('ntfy answered with an error ('+r.status+'). Please try again in a moment.');
let m=null;(await r.text()).split('\n').forEach(l=>{l=l.trim();if(!l)return;try{const o=JSON.parse(l);if(o.event==='message')m=o}catch(e){}});
if(!m)return null;
let text=String(m.message||'').trim();const at=m.attachment;
if(at&&at.url&&/^text\//.test(at.type||'')){try{const a=await fetch(at.url,{cache:'no-store'});if(a.ok){const t=(await a.text()).trim();if(t)text=t}}catch(e){}}
if(!text)return null;
return{title:String(m.title||'').trim(),text,time:(m.time||0)*1000}}
function drawRes(){const r=$('#res');if(!r)return;
if(!L.st){r.innerHTML='<div class="empty">Your summary will appear here.<br>Press the button the moment you lose the thread.</div>';return}
if(L.st===1){r.innerHTML='<div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk"></div><div class="sk" style="width:70%"></div>';return}
if(L.st===3){r.innerHTML=`<div class="empty"><b>We couldn’t get your summary.</b><br>${esc(L.err)}<br><br><button class="btn pri" data-a="lost">Try again</button></div>`;return}
if(L.st===4){r.innerHTML='<div class="empty"><b>No message available yet.</b><br>Nothing was found on your ntfy topic. Publish a message there, then press the button again.<br><br><button class="btn pri" data-a="lost">Check again</button></div>';return}
const X=L.cur;if(!X){L.st=0;return drawRes()}
r.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:18px"><div class="row"><b>${esc(X.t)}</b><span class="tag">Paragraph</span>${L.sample?'<span class="tag">Sample content</span>':''}</div><small class="mute">${esc(L.meta)}</small></div><textarea id="pb" class="pbox" rows="9" aria-label="Paragraph">${esc(X.p)}</textarea>`}

<div class="card" style="display:grid;gap:14px;align-content:start"><b>Appearance</b><div class="seg" style="justify-self:start">${['auto','light','dark'].map(t=>`<button data-a="theme" data-t="${t}" class="${t===th?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
<div class="card" style="display:grid;gap:14px;align-content:start"><b>Your data</b><p class="mute" style="margin:0">Your notes, events, goals and summaries are saved to your account on the server.</p><button class="btn ghost" data-a="wipe" style="justify-self:start">Delete my account</button></div></div>`}
document.addEventListener('change',e=>{if(e.target.id==='sn'){W('name',e.target.value.trim().slice(0,30)||'Student');toast('Name saved.')}});
